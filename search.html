<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Vulnerable App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e3c72;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        input {
            width: 70%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 28%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .result {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
        }
        .warning {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning">⚠️ VULNERABLE TEST APPLICATION</div>
        <div class="box">
            <h1>Product Search</h1>
            <p style="color: #666; margin-bottom: 20px;">Search our database (try SQL injection)</p>
            
            <form method="GET" action="">
                <input type="text" name="q" id="search" placeholder="Search products...">
                <button type="submit">Search</button>
            </form>
            
            <div id="results"></div>
        </div>
    </div>

    <script>
        // Get URL parameter
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q');
        
        if (query) {
            const resultsDiv = document.getElementById('results');
            document.getElementById('search').value = query;
            
            // VULNERABLE: Reflected XSS
            resultsDiv.innerHTML = '<div class="result"><strong>Search results for:</strong> ' + query + '</div>';
            
            // Simulated SQL Injection detection
            if (query.includes("'") || query.includes("OR") || query.includes("UNION")) {
                resultsDiv.innerHTML += '<div class="result" style="border-left: 4px solid #ff4444;">' +
                    '<strong>SQL Error:</strong> You have an error in your SQL syntax;<br>' +
                    'Check the manual that corresponds to your MySQL server version...<br>' +
                    '<span style="color: red;">Flag: SQL_INJECTION_FOUND</span></div>';
            } else {
                resultsDiv.innerHTML += '<div class="result">No products found matching your search.</div>';
            }
        }
    </script>
</body>
</html>
